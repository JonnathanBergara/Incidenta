services:
  - type: web
    name: plataforma-incidenta
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ANALISTA_PASSWORD
        sync: false
      - key: SEED_LECTOR_PASSWORD
        sync: false
